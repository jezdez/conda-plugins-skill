name: README setup

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  setup:
    name: README setup (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.4
          package-manager-cache: false
      - uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
        with:
          locked: true
      - name: Install the README skills and check client discovery
        run: pixi run --locked python scripts/check_setup.py
        env:
          SKILLS_TEST_OUTPUT: ${{ runner.temp }}/readme-setup
          SKILLS_TEST_GITHUB_TOKEN: ${{ github.token }}
      - name: Save verification results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: readme-setup-${{ matrix.os }}
          path: ${{ runner.temp }}/readme-setup/*.json
          if-no-files-found: warn
          retention-days: 7
