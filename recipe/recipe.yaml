schema_version: 1

package:
  name: agent-skill-conda-plugin-skill
  version: "26.11.0"

source:
  path: ..
  filter:
    - skills/conda-plugin-skill/**
    - LICENSE

build:
  number: 0
  noarch: generic
  script:
    interpreter: python
    content: |
      import os
      import shutil
      from pathlib import Path

      source = Path("skills/conda-plugin-skill")
      target = Path(os.environ["PREFIX"]) / "share/agent-skills/conda-plugin-skill"
      shutil.copytree(source, target)
      files = [path for path in source.rglob("*") if path.is_file()]
      assert {path.relative_to(source) for path in files} == {
          path.relative_to(target) for path in target.rglob("*") if path.is_file()
      }
      for path in files:
          assert path.read_bytes() == (target / path.relative_to(source)).read_bytes()

requirements:
  build:
    - python >=3.11,<3.15

tests:
  - package_contents:
      strict: true
      files:
        - share/agent-skills/conda-plugin-skill/SKILL.md
        - share/agent-skills/conda-plugin-skill/LICENSE
        - share/agent-skills/conda-plugin-skill/THIRD_PARTY_NOTICES.md
        - share/agent-skills/conda-plugin-skill/references/*.md
  - script:
      interpreter: python
      content: |
        import os
        from pathlib import Path

        skill = Path(os.environ["CONDA_PREFIX"]) / "share/agent-skills/conda-plugin-skill"
        assert (skill / "SKILL.md").stat().st_size > 0
        assert (skill / "LICENSE").stat().st_size > 0
        assert (skill / "THIRD_PARTY_NOTICES.md").stat().st_size > 0
        assert len(list((skill / "references").glob("*.md"))) == 8
    requirements:
      run:
        - python >=3.11,<3.15

about:
  summary: Agent guidance for developing and maintaining conda plugins
  license: Apache-2.0
  license_file:
    - LICENSE
    - skills/conda-plugin-skill/THIRD_PARTY_NOTICES.md
  homepage: https://github.com/jezdez/conda-plugin-skill
  repository: https://github.com/jezdez/conda-plugin-skill
