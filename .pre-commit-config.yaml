repos:
  - repo: builtin
    hooks:
      - id: check-yaml
        args: [--disallow-unknown-tags]
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: end-of-file-fixer
        exclude: '(^|/)LICENSE$'
      - id: trailing-whitespace
        exclude: '(^|/)LICENSE$|THIRD_PARTY_NOTICES\.md$'
      - id: require-pattern
        name: Conda package name and calendar version
        files: ^recipe/recipe\.yaml$
        args:
          - --multiline
          - '^package:\n  name: agent-skill-conda-plugin-skill\n  version: "[0-9]{2}\.([1-9]|1[0-2])\.(0|[1-9][0-9]*)"\n'
      - id: require-pattern
        name: Conda noarch build metadata
        files: ^recipe/recipe\.yaml$
        args:
          - --multiline
          - '^build:\n  number: (0|[1-9][0-9]*)\n  noarch: generic\n'
      - id: require-pattern
        name: Skill name description and license
        files: ^skills/conda-plugin-skill/SKILL\.md$
        args:
          - --multiline
          - '\A---\nname: conda-plugin-skill\ndescription: [A-Za-z][^\n:#]{0,1023}\nlicense: Apache-2\.0\n---\n'
  - repo: local
    hooks:
      - id: links
        name: Local Markdown links and anchors
        entry: pixi run --locked links
        language: system
        pass_filenames: false
        always_run: true
