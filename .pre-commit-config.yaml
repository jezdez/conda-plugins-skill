repos:
  - repo: builtin
    hooks:
      - id: check-yaml
        args: [--disallow-unknown-tags]
      - id: check-toml
      - id: check-merge-conflict
      - id: end-of-file-fixer
        exclude: '(^|/)LICENSE$'
      - id: trailing-whitespace
        exclude: '(^|/)LICENSE$|THIRD_PARTY_NOTICES\.md$'
      - id: require-pattern
        name: Conda package name and calendar version
        files: ^recipe/recipe\.yaml$
        args:
          - --multiline
          - '^package:\n  name: agent-skill-conda-plugin-skill\n  version: "[0-9]{2}\.(0[1-9]|1[0-2])\.(0|[1-9][0-9]*)"\n'
      - id: require-pattern
        name: Conda noarch build metadata
        files: ^recipe/recipe\.yaml$
        args:
          - --multiline
          - '^build:\n  number: (0|[1-9][0-9]*)\n  noarch: generic\n'
  - repo: local
    hooks:
      - id: skill-check
        name: Validate skill metadata and references
        entry: pixi run --locked validate
        language: system
        pass_filenames: false
        always_run: true
      - id: ruff-check
        name: Ruff lint
        entry: pixi run --locked lint
        language: system
        pass_filenames: false
        always_run: true
      - id: ruff-format
        name: Ruff format
        entry: pixi run --locked format-check
        language: system
        pass_filenames: false
        always_run: true
      - id: type-check
        name: Python type checks
        entry: pixi run --locked type-check
        language: system
        pass_filenames: false
        always_run: true
      - id: tests
        name: Repository tests
        entry: pixi run --locked test
        language: system
        pass_filenames: false
        always_run: true
