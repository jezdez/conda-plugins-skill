[workspace]
name = "conda-plugins-skill"
description = "Portable agent skills for conda plugin development"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64", "win-64"]

[dependencies]
python = ">=3.11"
prek = ">=0.5.9"
rattler-build = ">=0.67"
lychee = ">=0.20"
actionlint = ">=1.7"

[tasks]
links = "lychee --offline --include-fragments '*.md' 'skills/**/*.md'"
# actionlint 1.7.12 does not yet recognize GitHub's self-repository syntax.
workflows = "actionlint -ignore '^reusable workflow call \"\\$/\\.github/workflows/checks\\.yml\" at \"uses\" is not following the format'"
check = { depends-on = ["prek"] }
build-conda = { cmd = "rattler-build build --recipe recipe/recipe.yaml --output-dir dist/conda --no-config --no-include-recipe", depends-on = ["check"] }
prek = "prek run --all-files"
install-hooks = "prek install"
