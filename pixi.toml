[workspace]
name = "conda-plugin-skill"
description = "Portable agent skills for conda plugin development"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64", "win-64"]

[dependencies]
python = ">=3.11"
prek = ">=0.5.9"
rattler-build = ">=0.67"
lychee = ">=0.20"

[tasks]
links = "lychee --offline --include-fragments '*.md' 'skills/**/*.md'"
check = { depends-on = ["prek"] }
build = { cmd = "mkdir -p ../dist && python -m zipfile --create ../dist/conda-plugin-skill.zip conda-plugin-skill && python -m zipfile --test ../dist/conda-plugin-skill.zip", cwd = "skills", depends-on = ["check"] }
build-conda = { cmd = "rattler-build build --recipe recipe/recipe.yaml --output-dir dist/conda --no-config", depends-on = ["check"] }
prek = "prek run --all-files"
install-hooks = "prek install"
