[workspace]
name = "conda-plugin-skill"
description = "Portable agent skills for conda plugin development"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64", "win-64"]

[dependencies]
python = ">=3.11"
pytest = ">=8"
ruff = ">=0.14"
ty = ">=0.0.1"
prek = ">=0.5.9"
rattler-build = ">=0.67"

[target.win-64.dependencies]
# ty cannot discover conda-forge Python 3.15's lib/python/site-packages on Windows.
python = ">=3.11,<3.15"

[tasks]
validate = "python scripts/check.py"
lint = "ruff check scripts tests"
format = "ruff format scripts tests"
format-check = "ruff format --check scripts tests"
type-check = "ty check scripts tests"
test = "pytest"
check = { depends-on = ["prek"] }
build = "python scripts/package.py"
build-conda = { cmd = "rattler-build build --recipe recipe/recipe.yaml --output-dir dist/conda --no-config", depends-on = ["validate"] }
prek = "prek run --all-files"
install-hooks = "prek install"
